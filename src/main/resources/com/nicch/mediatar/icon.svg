<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073642"/>
      <stop offset="100%" stop-color="#00212b"/>
    </linearGradient>
    <linearGradient id="primaryWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc322f"/>
      <stop offset="50%" stop-color="#cb4b16"/>
      <stop offset="100%" stop-color="#dc322f"/>
    </linearGradient>
    <linearGradient id="cyanWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2aa198"/>
      <stop offset="100%" stop-color="#268bd2"/>
    </linearGradient>
    <linearGradient id="greenWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#859900"/>
      <stop offset="100%" stop-color="#b58900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#586e75" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Film Track Aperture / Timeline Guide Grids -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#002b36" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#586e75" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="#002b36" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Timeline Playhead Line -->
  <line x1="256" y1="88" x2="256" y2="424" stroke="#d33682" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Lower Audio/Video Track (Cyan / Blue) -->
  <path d="M 88 340 Q 140 370 190 325 T 280 345 T 370 310 T 424 335" 
        fill="none" stroke="url(#cyanWave)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Secondary Track (Green / Gold) -->
  <path d="M 88 290 Q 135 240 185 270 T 275 250 T 365 285 T 424 260" 
        fill="none" stroke="url(#greenWave)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Main Waveform "M" Shape (Red / Orange Coral) with glow -->
  <path d="M 88 350 L 165 155 L 256 265 L 347 155 L 424 350" 
        fill="none" stroke="url(#primaryWave)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Playhead Indicator Nodes -->
  <circle cx="88" cy="350" r="16" fill="#cb4b16"/>
  <circle cx="165" cy="155" r="13" fill="#dc322f"/>
  <circle cx="256" cy="265" r="18" fill="#fdf6e3" stroke="#dc322f" stroke-width="6"/>
  <circle cx="347" cy="155" r="13" fill="#dc322f"/>
  <circle cx="424" cy="350" r="16" fill="#cb4b16"/>

  <!-- Center Play Reel Emblem Accent -->
  <polygon points="250,255 250,275 266,265" fill="#dc322f"/>
</svg>
